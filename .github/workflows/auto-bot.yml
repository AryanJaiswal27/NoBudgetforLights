name: Auto Commit PR Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # runs every hour (optional)

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "github-actions-bot"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Create Branch
        run: |
          git checkout -B auto-update

      - name: Make Automated Change
        run: |
          echo "Updated at $(date)" >> bot-log.txt

      - name: Commit Changes
        run: |
          git add .
          git commit -m "🤖 Automated update" || echo "No changes to commit"

      - name: Push Branch
        run: |
          git push origin auto-update --force

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install gh -y

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "🤖 Automated PR" \
            --body "Created automatically by GitHub bot" \
            --base main \
            --head auto-update || echo "PR already exists"

      - name: Enable Auto Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge auto-update --merge --auto
